schema_version: '1.0'
name: 04-nearmiss-uk-vat
tags:
- eu-company-guide
- near-miss
- uk-business
runs: 3
execution:
  prompt: |
    My UK limited company's turnover just went past £85,000. Do I need to register for VAT?
  max_turns: 12
  timeout_seconds: 360
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
graders:
- type: tool_used
  name: trigger-not-fired
  tool: Skill
  input_match: eu-company-guide
  min: 0
  max: 0
  arm: both
  weight: 1
- type: llm
  name: does-the-task
  criteria: |
    Pass if this is true of the reply: It says the UK VAT registration threshold is £90,000 (so at £85,000 registration is not yet compulsory, though the company should watch the rolling 12-month figure).
  weight: 1
