schema_version: '1.0'
name: 05-nearmiss-us-sales-tax
tags:
- eu-company-guide
- near-miss
runs: 3
execution:
  prompt: |
    I sell SaaS to customers in Texas and New York from a US company. Do I need to collect sales tax?
  max_turns: 12
  timeout_seconds: 360
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
graders:
- type: tool_used
  name: trigger-not-fired
  tool: Skill
  input_match: eu-company-guide
  min: 0
  max: 0
  arm: both
  weight: 1
- type: llm
  name: does-the-task
  criteria: |
    Pass if this is true of the reply: It discusses US state sales tax and economic nexus thresholds, and notes that SaaS taxability varies by state (Texas and New York both generally tax SaaS in some form).
  weight: 1
